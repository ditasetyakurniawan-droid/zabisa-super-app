sonar.projectKey=zabisa-platform
sonar.projectName=Zabisa Platform
sonar.sourceEncoding=UTF-8
sonar.sources=services,packages,apps
sonar.exclusions=**/node_modules/**,**/.next/**,**/coverage/**,**/migrations/**
sonar.tests=services,packages,apps
sonar.test.inclusions=**/*_test.go,**/*.test.ts,**/*.test.tsx
sonar.go.coverage.reportPaths=coverage/go-cover.out
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.qualitygate.wait=true
