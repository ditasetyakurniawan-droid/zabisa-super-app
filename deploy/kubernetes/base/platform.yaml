apiVersion: v1
kind: Namespace
metadata:
  name: zabisa-dt
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: zabisa-app
  namespace: zabisa-dt
automountServiceAccountToken: false
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: zabisa-dt
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-services
  namespace: zabisa-dt
spec:
  podSelector:
    matchLabels: {tier: backend}
  ingress:
    - from:
        - podSelector: {matchLabels: {app: api-gateway}}
  policyTypes: [Ingress]
