apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: zabisa-dt
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://REPLACE_WITH_GITOPS_REPO
    targetRevision: main
    path: deploy/kubernetes/base
  destination:
    server: https://kubernetes.default.svc
    namespace: zabisa-dt
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
