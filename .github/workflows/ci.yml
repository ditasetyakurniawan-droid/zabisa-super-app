name: Engineering Quality Gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Go, Node, Mobile, Backoffice, Sonar
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      GOTOOLCHAIN: local
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go from go.mod
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install locked Node dependencies
        run: npm ci --workspaces --include-workspace-root --no-audit --no-fund

      - name: Run repository quality gate
        run: ./scripts/quality-gate.sh

      - name: Review reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./packages/go/... ./services/...

      - name: SonarQube analysis and quality gate
        if: ${{ vars.SONAR_ENABLED == 'true' }}
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      - name: Retain coverage and test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-reports-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            coverage/go-cover.out
            coverage/go-test-report.json
            coverage/npm-audit.json
            apps/admin-web/coverage/
            apps/mobile/coverage/

  browser-e2e:
    name: Backoffice Browser E2E
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      ZABISA_REPO: ${{ github.workspace }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install locked Node dependencies
        run: npm ci --workspaces --include-workspace-root --no-audit --no-fund

      - name: Start isolated local stack
        run: |
          docker compose up -d --build
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8088/health/ready >/dev/null && \
               curl -fsS http://127.0.0.1:3001/login >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color --tail=200
          exit 1

      - name: Seed development-only E2E data
        run: npm run demo:seed

      - name: Run real Chrome Backoffice matrix
        run: ./scripts/admin-browser-e2e.sh

      - name: Capture Compose diagnostics
        if: always()
        run: |
          mkdir -p build/ci
          docker compose ps > build/ci/compose-ps.txt
          docker compose logs --no-color > build/ci/compose.log

      - name: Retain browser failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-e2e-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            apps/admin-web/playwright-report/
            apps/admin-web/test-results/
            build/ci/

      - name: Stop isolated local stack
        if: always()
        run: docker compose down --volumes --remove-orphans
